<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>License Required — {{ resource_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1210;
    --paper: #F2EFE6;
    --green: #3D8361;
    --amber: #E8A33D;
    --faded: #8B8378;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    margin: 0;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 32px;
    position: relative;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    line-height: 1.3;
  }
  p {
    font-size: 14px;
    color: var(--faded);
    line-height: 1.5;
    margin: 0 0 24px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  input {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
    border: 1.5px dashed var(--faded);
    border-radius: 3px;
    padding: 12px 14px;
    font-size: 14px;
    background: transparent;
    color: var(--ink);
  }
  input:focus {
    outline: none;
    border-color: var(--green);
    border-style: solid;
  }
  button {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    background: var(--green);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 13px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  button:hover { background: #336f52; }
  a.buy {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--green);
    text-decoration: none;
    font-weight: 500;
  }
  a.buy:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Locked</div>
    <h1>{{ resource_name }} needs a license</h1>
    <p>Enter your license key to unlock this resource, or purchase one below.</p>
    <form method="POST" action="/resource/{{ resource_id }}/activate">
      <input type="text" name="license_key" placeholder="LIC-XXXXXXXXXXXXXXXX" required>
      <button type="submit">Activate</button>
    </form>
    <a class="buy" href="/pricing">Don't have a license? Buy one →</a>
  </div>
</body>
</html>
