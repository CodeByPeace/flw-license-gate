<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ resource.name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1210;
    --paper: #F2EFE6;
    --green: #3D8361;
    --faded: #8B8378;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 32px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 24px;
  }
  a.back {
    font-size: 13px;
    color: var(--faded);
    text-decoration: none;
  }
  a.back:hover { color: var(--green); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">✓ Unlocked</div>
    <h1>{{ resource.name }}</h1>
    <a class="back" href="/">← Back home</a>
  </div>
</body>
</html>
